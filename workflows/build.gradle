apply plugin: 'org.jetbrains.kotlin.plugin.jpa'
apply plugin: 'net.corda.plugins.quasar-utils'
apply plugin: 'net.corda.plugins.cordapp'

description 'token-sdk workflows'

evaluationDependsOn(":modules:selection")

def selectionProject = project(":modules:selection")

cordapp {
    targetPlatformVersion 140
    minimumPlatformVersion 140
    workflow {
        name "Token SDK Workflows"
        vendor "R3"
        licence "Apache 2"
        versionId 2
    }
    signing {
        enabled false
    }
}

sourceSets {
    main {
        resources {
            srcDir rootProject.file("config/dev")
        }
    }
    test {
        resources {
            srcDir rootProject.file("config/test")
        }
    }
    integrationTest {
        kotlin {
            compileClasspath += main.output + test.output
            runtimeClasspath += main.output + test.output
            srcDir file('src/integrationTest/kotlin')
        }
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntime.extendsFrom testRuntime
    // Hibernate 7, for the compile-only file dependency below.
    hibernate7Annotations {
        canBeConsumed = false
        transitive = false
    }
}

compileKotlin{
    dependsOn (selectionProject.jar)
}

dependencies {
    // Corda dependencies.
    cordaProvided("$corda_release_group:corda-core:$corda_release_version") {
        changing = true
    }

    cordaProvided("$corda_release_group:corda-node-api:$corda_release_version") {
        changing = true
    }

    cordaProvided("$corda_release_group:corda-serialization:$corda_release_version") {
        changing = true
    }

    cordaProvided("$corda_release_group:corda-core-test-utils:$corda_release_version") {
        changing = true
    }

    // Both persistence APIs are compile-only and neither is bundled: the node provides the one its Hibernate version
    // implements (javax.persistence on Corda 4.14 and earlier, jakarta.persistence on Corda 4.15). No Hibernate dependency.
    compileOnly "javax.persistence:javax.persistence-api:$javax_persistence_version"
    compileOnly "jakarta.persistence:jakarta.persistence-api:$jakarta_persistence_version"

    // DistributionRecord carries the Hibernate 5 and the Hibernate 7 mapping of its linear_id column (see there). Both Hibernate jars
    // are compile-only, neither is published or bundled: the node provides the one it runs. Hibernate 7 is a file dependency, because
    // Gradle does not resolve both hibernate-core modules into one configuration (they declare the same capability).
    compileOnly "org.hibernate:hibernate-core:$hibernate5_version"
    hibernate7Annotations "org.hibernate.orm:hibernate-core:$hibernate7_version"
    compileOnly files(configurations.hibernate7Annotations)
    // DistributionRecordMappingTest builds that mapping with the Hibernate of the Corda version the tests run on (Hibernate 7 from
    // Corda 4.15), which the Corda dependencies only put on the test runtime classpath.
    def cordaRunsHibernate7 = (corda_release_version.tokenize('.')[1].find(/^\d+/) as int) >= 15
    testCompileOnly(cordaRunsHibernate7 ? "org.hibernate.orm:hibernate-core:$hibernate7_version" : "org.hibernate:hibernate-core:$hibernate5_version")

    implementation "org.slf4j:slf4j-api:$slf4j_version"
    implementation "org.liquibase:liquibase-core:$liquibase_version"
    implementation "com.google.guava:guava:$guava_version"
    implementation "org.postgresql:postgresql:$postgresql_version"
    implementation(files(selectionProject.jar.archivePath))

    runtimeOnly "org.iq80.snappy:snappy:$snappy_version"

    // Logging.
    testImplementation "org.apache.logging.log4j:log4j-slf4j2-impl:${log4j_version}"

    testImplementation "com.typesafe:config:$typesafe_config_version"
    testImplementation "io.reactivex:rxjava:$rxjava_version"
    testImplementation "co.paralleluniverse:quasar-core:$quasar_version"

    // Testing.
    testImplementation "$corda_release_group:corda-node:$corda_release_version"
    testImplementation("$corda_release_group:corda-node-driver:$corda_release_version") {
        exclude module: "gradle-tooling-api"
    }
    testImplementation "$corda_release_group:corda-test-utils:$corda_release_version"
    testImplementation "org.hamcrest:hamcrest-library:2.1"
    testImplementation "org.mockito.kotlin:mockito-kotlin:$mockito_kotlin_version"
    testImplementation "org.jetbrains.kotlin:kotlin-test:$kotlin_version"
    testImplementation "org.assertj:assertj-core:$assertj_version"
    testImplementation "junit:junit:$junit_version"

    // CorDapp dependencies.
    cordapp project(":contracts")

    //CI for confidential tokens
    cordapp "$confidential_id_release_group:ci-workflows:$confidential_id_release_version"

    //just for testing - this means you MUST specify the contracts-for-testing cordapp as a cordapp in all tests using test flows
    cordapp project(":modules:contracts-for-testing")

    testImplementation "org.gradle:gradle-tooling-api:7.1"
}

task integrationTest(type: Test, dependsOn: []) {
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
}

jar {
    archiveBaseName = "tokens-workflows"
}

quasar {
    excludePackages.addAll(
            "antlr**",
            "com.codahale**",
            "com.fasterxml.**",
            "com.github.benmanes.caffeine.**",
            "com.google.**",
            "com.lmax.**",
            "com.zaxxer.**",
            "net.bytebuddy**",
            "io.github.classgraph**",
            "io.netty*",
            "liquibase**",
            "net.i2p.crypto.**",
            "nonapi.io.github.classgraph.**",
            "org.apiguardian.**",
            "org.bouncycastle**",
            "org.codehaus.**",
            "org.h2**",
            "org.hibernate**",
            "org.jboss.**",
            "org.objenesis**",
            "org.w3c.**",
            "org.xml**",
            "org.yaml**",
            "rx**",
            "kotlin**"
    )
}

test {
    jvmArgs test_module_opens
}
