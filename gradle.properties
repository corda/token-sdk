# This versionSuffix value should be left blank for an external release (GA) or set to RC / HC for internal releases.
# No hyphen prefix needed. Also leave blank for standard release branch / feature branch activity
name=Token SDK
group=com.r3.corda.lib.tokens
baseVersion=1.3.5
versionSuffix=

kotlin.incremental=false
org.gradle.caching = false
gradleEnterpriseUrl = https://gradle.dev.r3.com
gradleEnterprisePlugin = 3.8.1
customUserDataGradlePlugin = 1.6.3
gradleTestRetryPlugin = 1.4.0

# Artifactory
artifactoryContextUrl = https://software.r3.com/artifactory
publicArtifactURL = https://download.corda.net/maven
internalPublishVersion=1.+

# The Corda version to build and test against; -PcordaReleaseVersion=4.15-RC02 on the command line overrides it.
cordaReleaseVersion=4.12.13

# additional dependencies
rxjava_version=1.3.8
slf4j_version=2.0.12
quasar_version=0.9.3_r3
liquibase_version=4.20.0
javax_persistence_version=2.2
jakarta_persistence_version=3.2.0
guava_version=33.1.0-jre
assertj_version=3.27.7
mockito_kotlin_version=4.1.0
typesafe_config_version=1.3.4
netty_version=4.1.138.Final
tcnative_version=2.0.74.Final
postgresql_version=42.7.12
micrometerVersion=1.17.1

